<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reproductor de Video Protegido</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    background: #0f0f0f;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    padding: 20px;
  }

  .player-wrapper {
    width: 100%;
    max-width: 900px;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  /* --- Pantalla completa: el wrapper ocupa toda la pantalla --- */
  .player-wrapper:fullscreen,
  .player-wrapper:-webkit-full-screen {
    max-width: 100%;
    width: 100%;
    height: 100%;
    border-radius: 0;
  }

  .player-wrapper:fullscreen .video-container,
  .player-wrapper:-webkit-full-screen .video-container {
    height: 100%;
  }

  .player-wrapper:fullscreen video,
  .player-wrapper:-webkit-full-screen video {
    height: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .video-container {
    position: relative;
    width: 100%;
    background: #000;
    min-height: 200px;
  }

  video {
    width: 100%;
    display: block;
    max-height: 80vh;
    /* Capa invisible encima evita drag & drop directo del <video> */
    pointer-events: none;
  }

  /* Capa transparente que captura los clics reales (evita "Guardar video como") */
  .click-shield {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    cursor: pointer;
  }

  .loading-msg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #aaa;
    font-size: 14px;
    z-index: 1;
  }

  /* --- Controles ahora flotan SOBRE el video --- */
  .controls {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 24px 16px 14px;
    background: linear-gradient(to top, rgba(0,0,0,0.85), rgba(0,0,0,0));
    color: #fff;
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: auto;
  }

  /* Estado oculto: se agrega/quita con JS tras 2s de inactividad */
  .controls.hidden {
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
  }

  /* Mientras los controles están ocultos, mostrar cursor normal en vez de "mano" */
  .video-container.controls-hidden {
    cursor: none;
  }

  button.control-btn {
    background: rgba(255,255,255,0.12);
    border: none;
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transition: background 0.2s ease;
    flex-shrink: 0;
  }

  button.control-btn:hover {
    background: rgba(255,255,255,0.25);
  }

  .progress-container {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.25);
    border-radius: 3px;
    cursor: pointer;
    position: relative;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: #e50914;
    border-radius: 3px;
    position: relative;
  }

  .time-display {
    font-size: 13px;
    color: #eee;
    white-space: nowrap;
    min-width: 90px;
    text-align: center;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }

  .volume-container {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  input[type="range"].volume-slider {
    width: 70px;
    accent-color: #e50914;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="player-wrapper" id="playerWrapper">
  <div class="video-container" id="videoContainer">
    <div class="loading-msg" id="loadingMsg">Cargando video...</div>
    <video id="miVideo" playsinline controlsList="nodownload noremoteplayback" disablePictureInPicture>
      Tu navegador no soporta la reproducción de video.
    </video>
    <div class="click-shield" id="clickShield"></div>

    <div class="controls" id="controls">
      <button class="control-btn" id="playPauseBtn" title="Reproducir/Pausar">▶</button>

      <div class="time-display" id="timeDisplay">00:00 / 00:00</div>

      <div class="progress-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="volume-container">
        <span id="volumeIcon">🔊</span>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
      </div>

      <button class="control-btn" id="fullscreenBtn" title="Pantalla completa">⛶</button>
    </div>
  </div>
</div>

<script>
  // ============ URL DE TU WORKER (proxy protegido, no R2 directo) ============
  const VIDEO_URL = "https://red-hat-d80e.cursodiegogaona.workers.dev";
  // ==============================================================================

  const playerWrapper = document.getElementById('playerWrapper');
  const video = document.getElementById('miVideo');
  const videoContainer = document.getElementById('videoContainer');
  const clickShield = document.getElementById('clickShield');
  const loadingMsg = document.getElementById('loadingMsg');
  const controls = document.getElementById('controls');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const progressContainer = document.getElementById('progressContainer');
  const progressBar = document.getElementById('progressBar');
  const timeDisplay = document.getElementById('timeDisplay');
  const volumeSlider = document.getElementById('volumeSlider');
  const volumeIcon = document.getElementById('volumeIcon');
  const fullscreenBtn = document.getElementById('fullscreenBtn');

  let blobUrl = null;

  // --- Cargar el video como blob para que el src visible no sea la URL real ---
  async function cargarVideo() {
    try {
      const respuesta = await fetch(VIDEO_URL);
      const blob = await respuesta.blob();
      blobUrl = URL.createObjectURL(blob);
      video.src = blobUrl;
      loadingMsg.style.display = 'none';
    } catch (err) {
      loadingMsg.textContent = 'No se pudo cargar el video.';
      console.error(err);
    }
  }
  cargarVideo();

  // Liberar memoria del blob al salir de la página
  window.addEventListener('beforeunload', () => {
    if (blobUrl) URL.revokeObjectURL(blobUrl);
  });

  // --- Formatear tiempo ---
  function formatTime(seconds) {
    if (isNaN(seconds)) return "00:00";
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = Math.floor(seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  // --- Play / Pause ---
  function togglePlay() {
    if (video.paused) {
      video.play();
      playPauseBtn.textContent = '⏸';
    } else {
      video.pause();
      playPauseBtn.textContent = '▶';
    }
  }
  playPauseBtn.addEventListener('click', togglePlay);
  clickShield.addEventListener('click', togglePlay);

  video.addEventListener('timeupdate', () => {
    const percent = (video.currentTime / video.duration) * 100;
    progressBar.style.width = `${percent}%`;
    timeDisplay.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
  });

  video.addEventListener('loadedmetadata', () => {
    timeDisplay.textContent = `${formatTime(0)} / ${formatTime(video.duration)}`;
  });

  video.addEventListener('ended', () => {
    playPauseBtn.textContent = '▶';
    mostrarControles(); // al terminar, dejamos los controles visibles
  });

  progressContainer.addEventListener('click', (e) => {
    const rect = progressContainer.getBoundingClientRect();
    const clickX = e.clientX - rect.left;
    const percent = clickX / rect.width;
    video.currentTime = percent * video.duration;
  });

  volumeSlider.addEventListener('input', () => {
    video.volume = volumeSlider.value;
    volumeIcon.textContent = video.volume == 0 ? '🔇' : (video.volume < 0.5 ? '🔉' : '🔊');
  });

  // --- Pantalla completa: se aplica al wrapper completo (video + controles superpuestos) ---
  fullscreenBtn.addEventListener('click', () => {
    if (playerWrapper.requestFullscreen) {
      playerWrapper.requestFullscreen();
    } else if (playerWrapper.webkitRequestFullscreen) {
      playerWrapper.webkitRequestFullscreen();
    } else if (playerWrapper.msRequestFullscreen) {
      playerWrapper.msRequestFullscreen();
    }
  });

  // ============ AUTO-OCULTAR CONTROLES A LOS 2 SEGUNDOS ============
  let hideTimeout = null;

  function mostrarControles() {
    controls.classList.remove('hidden');
    videoContainer.classList.remove('controls-hidden');
    reiniciarTimerOcultar();
  }

  function ocultarControles() {
    // No ocultar si el video está pausado, cargando, o el mouse sigue sobre un control
    if (video.paused) return;
    controls.classList.add('hidden');
    videoContainer.classList.add('controls-hidden');
  }

  function reiniciarTimerOcultar() {
    clearTimeout(hideTimeout);
    hideTimeout = setTimeout(ocultarControles, 2000);
  }

  // Cualquier movimiento o toque sobre el reproductor reactiva los controles
  videoContainer.addEventListener('mousemove', mostrarControles);
  videoContainer.addEventListener('touchstart', mostrarControles);
  controls.addEventListener('mousemove', mostrarControles);

  // Al pausar, mantener controles visibles; al reproducir, arrancar el timer
  video.addEventListener('play', reiniciarTimerOcultar);
  video.addEventListener('pause', mostrarControles);

  // Iniciar con controles visibles y su temporizador
  mostrarControles();

  // ============ PROTECCIONES ADICIONALES ============

  // Bloquear el menú de clic derecho en toda la página
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // Bloquear arrastrar el video fuera de la página
  document.addEventListener('dragstart', (e) => e.preventDefault());

  // Bloquear atajos comunes de inspección
  document.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) ||
      (e.ctrlKey && key === 'u') ||
      (e.metaKey && e.altKey && key === 'i') // Mac
    ) {
      e.preventDefault();
    }
  });
</script>

</body>
</html>
