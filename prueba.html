<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clase SolidWorks — Curso Diego Gaona</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
/* ═══════════════════════════════════════════════════════
   VARIABLES Y RESET
   ═══════════════════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg:         #0d0f14;
    --surface:    #13161d;
    --surface2:   #1a1e28;
    --border:     #ffffff0f;
    --border2:    #ffffff2e;
    --accent:     #3b82f6;
    --accent-dim: #3b82f620;
    --orange:     #f97316;
    --text:       #e8eaf0;
    --text-muted: #ffffff;
    --text-dim:   #9ca3af;
    --green:      #10b981;
    --sidebar-w:  310px;
    --topbar-h:   58px;
}

html, body { height: 100%; overflow: hidden; }

body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
}

/* ── TOP BAR ── */
.topbar {
    height: var(--topbar-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    flex-shrink: 0;
    z-index: 100;
}

.topbar-brand {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.02em;
}
.topbar-brand span { color: var(--accent); }

.topbar-sep { flex: 1; }

.topbar-progress {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-muted);
}

.progress-bar {
    width: 120px;
    height: 15px;
    background: var(--border2);
    border-radius: 99px;
    overflow: hidden;
}
.progress-fill {
    height: 100%;
    background: var(--orange);
    border-radius: 99px;
    transition: width 0.4s ease;
    width: 0%;
}

.btn-nav {
    height: 34px;
    padding: 0 14px;
    border-radius: 7px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
}
.btn-nav:hover    { background: var(--surface2); border-color: var(--border2); }
.btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }

.btn-nav.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 500;
}
.btn-nav.primary:hover { background: #2563eb; border-color: #2563eb; }

/* ── LAYOUT ── */
.layout {
    flex: 1;
    display: flex;
    overflow: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
}

.sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    padding-top: 10px;
}

.lesson-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    cursor: pointer;
    background: var(--accent-dim); 
    border-left: 2px solid var(--accent);
}

.lesson-check {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--border2);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    cursor: pointer;
}
.lesson-check.done { background: var(--green); border-color: var(--green); }
.lesson-check.done::after {
    content: '';
    width: 5px;
    height: 8px;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(45deg) translate(-1px, -1px);
    display: block;
}

.lesson-meta { flex: 1; }
.lesson-name { font-size: 14px; font-weight: 500; color: var(--text); }

/* ── MAIN CONTENT ── */
.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    background: var(--bg);
}

.content-inner {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding: 36px 32px 60px;
}

.lesson-title-main {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 20px;
}

/* ── VIDEO (Optimizado para Cloudflare HTML5) ── */
.video-wrap {
    position: relative;
    width: 100%;
    background: #000;
    border-radius: 10px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
    overflow: hidden;
    aspect-ratio: 16/9; /* Mantiene la proporción automáticamente */
}
.video-wrap video {
    width: 100%;
    height: 100%;
    display: block;
}

/* ── RESPONSIVE BÁSICO ── */
@media (max-width: 768px) {
    .sidebar { display: none; } /* Oculta sidebar en móvil para simplificar */
    .topbar-progress { display: none; }
    .content-inner { padding: 18px 14px 100px; }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
    <div class="topbar-brand">Clase Única<span id="brandAccent"> — SolidWorks</span></div>
    <div class="topbar-sep"></div>
    <div class="topbar-progress">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <span id="progressText">0%</span>
    </div>
    <button class="btn-nav primary" id="btnNext">✓ Marcar como completado</button>
</div>

<!-- LAYOUT -->
<div class="layout">
    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-scroll" id="sidebarScroll">
            <!-- Renderizado dinámicamente -->
        </div>
    </div>

    <!-- MAIN -->
    <div class="main">
        <div class="content-inner" id="contentInner">
            <!-- Renderizado dinámicamente -->
        </div>
    </div>
</div>

<script>
// 1. CONFIGURACIÓN DE LA ÚNICA CLASE
const unicaClase = { 
    id: 1, 
    title: "Lección en Video (Cloudflare)", 
    videoUrl: "https://pub-28ab12728b934c278db2d17fd2d4d54f.r2.dev/Activar%20enganche.mp4" // <-- ¡Aquí pones tu link del bucket!
};

let completado = false;

// 2. RENDERIZAR LA BARRA LATERAL (SIDEBAR)
function renderSidebar() {
    const sidebarEl = document.getElementById('sidebarScroll');
    sidebarEl.innerHTML = `
        <div class="lesson-item">
            <div class="lesson-check ${completado ? 'done' : ''}" onclick="toggleDone()"></div>
            <div class="lesson-meta">
                <div class="lesson-name">${unicaClase.title}</div>
            </div>
        </div>
    `;
}

// 3. RENDERIZAR EL CONTENIDO PRINCIPAL (VIDEO)
function renderContent() {
    const el = document.getElementById('contentInner');
    
    el.innerHTML = `
        <h1 class="lesson-title-main">${unicaClase.title}</h1>
        <div class="video-wrap">
            <!-- Reproductor HTML5 Nativo ideal para Cloudflare R2 -->
            <video controls controlsList="nodownload">
                <source src="${unicaClase.videoUrl}" type="video/mp4">
                Tu navegador no soporta la etiqueta de video.
            </video>
        </div>
    `;
}

// 4. LÓGICA DE PROGRESO
function toggleDone() {
    completado = !completado;
    
    // Actualizar UI
    document.getElementById('progressFill').style.width = completado ? '100%' : '0%';
    document.getElementById('progressText').textContent = completado ? '100%' : '0%';
    
    renderSidebar(); // Refresca el icono de completado
}

// Evento del botón superior
document.getElementById('btnNext').addEventListener('click', () => {
    if (!completado) toggleDone();
});

// 5. INICIALIZAR
renderSidebar();
renderContent();

</script>
</body>
</html>
