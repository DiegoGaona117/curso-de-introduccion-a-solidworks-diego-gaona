/* ═══════════════════════════════════════════════════════
   CURSO DIEGO GAONA — css.css
   Stylesheet compartido entre páginas del curso
   ═══════════════════════════════════════════════════════ */

/* ============================================================
   BLOQUE 3 — CSS: RESET + VARIABLES (:root) + TEMA CLARO
   ============================================================ */

/* ── UTILIDAD COMPARTIDA: TIP HD ── */
.hd-tip {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f9731610;
    border: 1px solid #f9731630;
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 24px;
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.5;
}
.hd-tip span { font-size: 18px; flex-shrink: 0; }

/* ── RESET ── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* ── VARIABLES (tema oscuro por defecto) ── */
:root {
    --bg:         #0d0f14;
    --surface:    #13161d;
    --surface2:   #1a1e28;
    --border:     #ffffff0f;
    --border2:    #ffffff2e;
    --accent:     #3b82f6;
    --accent-dim: #3b82f620;
    --orange:     #f97316;
    --text:       #e8eaf0;
    --text-muted: #ffffff;
    --text-dim:   #9ca3af;
    --green:      #10b981;
    --sidebar-w:  310px;
    --topbar-h:   58px;
}

html, body { height: 100%; overflow: hidden; }

body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
}

/* ============================================================
   BLOQUE 4 — CSS: TOPBAR
   ============================================================ */
.topbar {
    height: var(--topbar-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    flex-shrink: 0;
    z-index: 100;
}

.topbar-brand {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.02em;
    white-space: nowrap;
}
.topbar-brand span { color: var(--accent); }

.topbar-sep { flex: 1; }

.topbar-progress {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-muted);
}

.progress-bar {
    width: 120px;
    height: 15px;
    background: var(--border2);
    border-radius: 99px;
    overflow: hidden;
}
.progress-fill {
    height: 100%;
    background: var(--orange);
    border-radius: 99px;
    transition: width 0.4s ease;
}

.btn-nav {
    height: 34px;
    padding: 0 14px;
    border-radius: 7px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
    white-space: nowrap;
}
.btn-nav:hover    { background: var(--surface2); border-color: var(--border2); }
.btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }

.btn-nav.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 500;
}
.btn-nav.primary:hover { background: #2563eb; border-color: #2563eb; }

/* Hamburger — oculto en desktop, aparece en media queries */
.menu-toggle {
    display: none;
    height: 34px;
    padding: 0 12px;
    border-radius: 7px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
}

/* ============================================================
   BLOQUE 5 — CSS: LAYOUT + SIDEBAR
   ============================================================ */
.layout {
    flex: 1;
    display: flex;
    overflow: hidden;
}

.sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
    transition: transform 0.25s ease;
}

.sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border2) transparent;
}
.sidebar-scroll::-webkit-scrollbar       { width: 4px; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

.section-label {
    padding: 18px 16px 8px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
}

.lesson-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: all 0.15s;
    user-select: none;
    touch-action: manipulation;
}
.lesson-item:hover  { background: var(--surface2); }
.lesson-item.active { background: var(--accent-dim); border-left-color: var(--accent); }

.lesson-check {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--border2);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    cursor: pointer;
}
.lesson-check.done { background: var(--green); border-color: var(--green); }
.lesson-check.done::after {
    content: '';
    width: 5px;
    height: 8px;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(45deg) translate(-1px, -1px);
    display: block;
}

.lesson-meta { flex: 1; min-width: 0; }

.lesson-name {
    font-size: 14px;
    color: var(--text);
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.lesson-item.active .lesson-name { font-weight: 500; }

.lesson-dur {
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 2px;
}

.lesson-type-badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 500;
    flex-shrink: 0;
}
.badge-pdf  { background: #7c3aed20; color: #a78bfa; }
.badge-free { background: #10b98120; color: #10b981; }
.lesson-lock { font-size: 11px; flex-shrink: 0; opacity: 0.5; }

/* ============================================================
   BLOQUE 6 — CSS: MAIN / VIDEO / PDF CARD
   ============================================================ */
.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
}

.content-scroll {
    flex: 1;
    overflow-x: hidden;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border2) transparent;
}
.content-scroll::-webkit-scrollbar       { width: 4px; }
.content-scroll::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }

.content-inner {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    padding: 36px 32px 60px;
}

.lesson-title-main {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.03em;
    color: var(--text);
    margin-bottom: 20px;
    line-height: 1.3;
}

/* ── VIDEO ──
   Desktop: aspect-ratio define la altura → eventos de ratón correctos.
   Móvil:   el iframe se expande a VIDEO_MIN_W y se encoge con CSS zoom
            (zoom escala el coordinate space, transform:scale no lo hace,
             lo que rompe los eventos touch en WebView/Chrome Android). */
.video-wrap {
    position: relative;
    width: 100%;
    max-width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #000;
    border-radius: 10px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
}
.video-wrap iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
}

.video-wrap video {
    width: 100%;
    height: 100%;
    display: block;
}

/* ── PDF CARD ── */
.pdf-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px 32px;
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
}
.pdf-icon-box {
    width: 48px;
    height: 48px;
    background: #7c3aed20;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
}
.pdf-card-info  { flex: 1; }
.pdf-card-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.pdf-card-sub   { font-size: 13px; color: var(--text-muted); }

.btn-download {
    height: 36px;
    padding: 0 18px;
    background: #7c3aed;
    border: none;
    border-radius: 7px;
    color: #fff;
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: background 0.15s;
    flex-shrink: 0;
}
.btn-download:hover { background: #6d28d9; }

/* ── SECTION DIVIDER ── */
.section-divider { height: 1px; background: var(--border); margin: 24px 0; }

/* ============================================================
   BLOQUE 7 — CSS: PAYWALL + CONGRATS
   ============================================================ */
.paywall {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 60px 24px 40px;
    max-width: 460px;
    margin: 0 auto;
}
.paywall-icon {
    font-size: 60px;
    margin-bottom: 20px;
    line-height: 1;
}
.paywall-title {
    font-size: 24px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.02em;
    margin-bottom: 12px;
    line-height: 1.3;
}
.paywall-sub {
    font-size: 15px;
    color: var(--text-dim);
    line-height: 1.7;
    margin-bottom: 36px;
}
.paywall-btn-buy {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    height: 54px;
    background: var(--orange);
    color: #fff;
    border-radius: 12px;
    font-family: 'Sora', sans-serif;
    font-size: 16px;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 16px;
    box-shadow: 0 4px 24px rgba(249,115,22,0.40);
    transition: background 0.15s, transform 0.1s;
}
.paywall-btn-buy:hover  { background: #ea6c10; transform: translateY(-1px); }
.paywall-btn-buy:active { transform: scale(0.98); }
.paywall-btn-login {
    font-size: 14px;
    color: var(--text-dim);
    text-decoration: none;
    transition: color 0.15s;
}
.paywall-btn-login:hover { color: var(--text); }

/* ── CONGRATS ── */
.congrats-wrap  { text-align: center; padding: 40px 20px; }
.congrats-emoji { font-size: 72px; margin-bottom: 24px; display: block; }
.congrats-title { font-size: 28px; font-weight: 600; letter-spacing: -0.03em; margin-bottom: 12px; }
.congrats-sub   { font-size: 16px; color: var(--text-dim); line-height: 1.7; max-width: 500px; margin: 0 auto; }

/* ============================================================
   BLOQUE 8 — CSS: OVERLAY + NAV MÓVIL FLOTANTE + MENU HINT + TOAST
   ============================================================ */
.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #00000080;
    z-index: 90;
}

.mobile-nav-bar  { display: none; }
.btn-float-prev  { display: none; }
.btn-float-next  { display: none; }

.menu-hint {
    position: fixed;
    top: calc(var(--topbar-h) + 10px);
    left: 10px;
    right: 10px;
    background: var(--orange);
    color: #fff;
    font-family: 'Sora', sans-serif;
    font-size: 16px;
    font-weight: 600;
    padding: 14px 44px 14px 18px;
    border-radius: 10px;
    z-index: 200;
    pointer-events: none;
    opacity: 0;
    transform: translateY(-4px);
    transition: opacity 0.35s, transform 0.35s;
    box-shadow: 0 4px 20px rgba(249, 115, 22, 0.45);
    line-height: 1.4;
}
.menu-hint::before {
    content: '';
    position: absolute;
    top: -6px;
    left: 20px;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-bottom: 6px solid var(--orange);
}
.menu-hint.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}
.menu-hint-close {
    position: absolute;
    top: 50%;
    right: 12px;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
    opacity: 0.8;
    -webkit-tap-highlight-color: transparent;
}
.menu-hint-close:hover { opacity: 1; }
@media (min-width: 1081px) {
    .menu-hint { display: none !important; }
}

.status-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--green);
    color: #fff;
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 14px 22px;
    border-radius: 10px;
    z-index: 300;
    box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    display: flex;
    align-items: center;
    gap: 8px;
}
.status-toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* ── TEMA CLARO ── */
body.light {
    --bg:         #f0f2f5;
    --surface:    #ffffff;
    --surface2:   #e8eaef;
    --border:     #0000000f;
    --border2:    #00000018;
    --text:       #1a1a2e;
    --text-muted: #333333;
    --text-dim:   #555555;
}

/* ============================================================
   BLOQUE 9 — CSS: RESPONSIVE (tablet / móvil / pantallas pequeñas)
   ============================================================ */

/* ── TABLET (≤ 1080px) ── */
@media (max-width: 1080px) {
    .sidebar {
        position: fixed;
        left: 0; top: 0; bottom: 0;
        z-index: 95;
        transform: translateX(-100%);
        padding-top: var(--topbar-h);
    }
    .sidebar.open   { transform: translateX(0); }
    .overlay.active { display: block; }

    .menu-toggle     { display: flex; }
    .topbar-brand    { display: none; }
    .topbar          { padding: 0 12px; gap: 8px; }
    #btnPrev         { display: none; }
    #btnTheme        { display: none; }

    .topbar-progress { display: flex; }
    .progress-bar    { width: 80px; }

    #btnNext { font-size: 12px; padding: 0 10px; }
}

/* ── MÓVIL (≤ 768px) ── */
@media (max-width: 768px) {
    :root { --sidebar-w: min(88vw, 320px); }

    .topbar       { padding: 0 10px; gap: 6px; }
    .progress-bar { width: 60px; height: 8px; }
    #progressText { font-size: 11px; }

    #btnMisCursos { display: flex; }
    #btnMisCursos .btn-label { display: inline; }

    #btnNext { display: none; }

    .content-inner { padding: 18px 14px 100px; }

    .lesson-title-main { font-size: 18px; }

    .pdf-card {
        flex-direction: column;
        padding: 20px;
        gap: 12px;
        align-items: flex-start;
    }
    .btn-download {
        width: 100%;
        height: 44px;
        justify-content: center;
        font-size: 14px;
    }

    .congrats-emoji { font-size: 52px; }
    .congrats-title { font-size: 22px; }
    .congrats-sub   { font-size: 14px; }

    .lesson-item  { padding: 12px 16px; }
    .lesson-check { width: 22px; height: 22px; }
    .lesson-name  { font-size: 13px; }

    /* ── VIDEO EN MÓVIL ──
       El iframe se renderiza en su ancho real (VIDEO_MIN_W) y JS aplica
       CSS zoom para encajarlo en el contenedor. zoom sí escala el
       coordinate space del iframe → los eventos touch llegan correctos
       (a diferencia de transform:scale que los desalinea). */
    .video-wrap {
        aspect-ratio: unset;
        padding-bottom: 72%;
        height: 0;
    }
    .video-wrap iframe {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: top left; /* residual, ya no se usa transform */
    }

    /* ── BARRA DE NAVEGACIÓN INFERIOR ── */
    .mobile-nav-bar {
        display: flex;
        position: fixed;
        bottom: 16px;
        left: 14px;
        right: 14px;
        gap: 10px;
        z-index: 50;
    }

    .btn-float-prev {
        display: flex;
        flex: 0 0 68px;
        height: 52px;
        background: var(--surface2);
        border: 1px solid var(--border2);
        color: var(--text);
        border-radius: 14px;
        font-size: 20px;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        transition: background 0.15s, transform 0.1s;
        -webkit-tap-highlight-color: transparent;
    }
    .btn-float-prev:disabled { opacity: 0.25; cursor: not-allowed; }
    .btn-float-prev:not(:disabled):active { background: var(--surface); transform: scale(0.97); }

    .btn-float-next {
        display: flex;
        flex: 1;
        height: 52px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 14px;
        font-family: 'Sora', sans-serif;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        gap: 6px;
        box-shadow: 0 4px 24px rgba(59, 130, 246, 0.40);
        transition: background 0.15s, transform 0.1s;
        -webkit-tap-highlight-color: transparent;
    }
    .btn-float-next:active { background: #2563eb; transform: scale(0.98); }
}

/* ── TELÉFONOS MUY PEQUEÑOS (≤ 380px) ── */
@media (max-width: 380px) {
    .topbar-progress  { display: none; }
    .content-inner    { padding: 14px 10px 100px; }
    .btn-float-next   { font-size: 13px; }
    .btn-float-prev   { flex: 0 0 56px; font-size: 18px; }
}

</style>

// ============================================================
// BLOQUE 25 — ESCALA DE VIDEO EN MÓVIL
// ============================================================
// FIX PRINCIPAL: se reemplazó transform:scale() por CSS zoom.
//
// El problema con transform:scale() en iframes es que escala visualmente
// el elemento pero NO escala su sistema de coordenadas interno. Los eventos
// touch llegan al iframe en coordenadas del host (sin desescalar), así que
// un tap en el centro visual del video llegaba al tercio izquierdo del
// iframe → el botón de play no respondía en muchos Android / Chrome WebView.
//
// zoom sí reescala el coordinate space: el navegador lo considera en
// hit-testing, por lo que los eventos touch llegan exactamente donde el
// usuario toca. Nota: zoom no está en el estándar W3C pero tiene soporte
// amplio en Chromium/Safari/WebView desde hace años.
const VIDEO_MIN_W = 560;

function applyVideoScale() {
    const wrap = document.querySelector('.video-wrap');
    if (!wrap) return;
    const iframe = wrap.querySelector('iframe');
    if (!iframe) return;

    const containerW = wrap.offsetWidth;

    if (containerW < VIDEO_MIN_W) {
        // Móvil: renderizar en el ancho mínimo del iframe y reducir con zoom
        const scale = containerW / VIDEO_MIN_W;
        iframe.style.width           = VIDEO_MIN_W + 'px';
        iframe.style.height          = Math.round(VIDEO_MIN_W * 0.72) + 'px';
        iframe.style.zoom            = scale;      // ← escala coordenadas correctamente
        iframe.style.transform       = '';         // asegurarse de limpiar cualquier transform previo
        iframe.style.transformOrigin = '';
    } else {
        // Desktop: CSS lo maneja solo (aspect-ratio 16/9).
        // Solo limpiar si previamente se aplicó zoom (ej: rotación móvil→desktop)
        if (iframe.style.zoom) {
            iframe.style.width           = '';
            iframe.style.height          = '';
            iframe.style.zoom            = '';
            iframe.style.transform       = '';
            iframe.style.transformOrigin = '';
        }
    }
}

// Re-aplicar escala de video al cambiar tamaño de ventana
window.addEventListener('resize', applyVideoScale);

    if (!document.hidden) {
        const estadoActual = getSessionEstado();
        if (estadoActual !== _lastEstado) {
            _lastEstado = estadoActual;
            renderContent();
            renderSidebar();
            updateProgress();
            renderBotonComprar();
        }
        // Además de comparar localStorage, revalidamos contra el Sheet
        // por si el estado cambió mientras la pestaña estaba en segundo plano.
        revalidarSesion();
    }
});

// ============================================================
// BLOQUE 27 — REVALIDACIÓN PERIÓDICA CONTRA GOOGLE SHEETS
// ============================================================
// Soluciona el caso: el alumno entra como "prueba", nunca vuelve a
// hacer login, pero compra el curso. En Sheets su estado pasa a
// "completo", pero su localStorage local se queda estancado en
// "prueba" hasta que este chequeo lo actualiza.
const WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbxEbbDW-MwWJQSorzOfWovtWb4YPGWaLp2XTMFgNPCuMI1qoTQZVgWh_W14qOJ8QoK3_g/exec';
const SESSION_DAYS = 30;

// ── Cierra la sesión de forma forzada (código inválido, sesión
// vieja sin código, o acceso removido) y refresca la UI para
// que el contenido bloqueado muestre el paywall correspondiente. ──
function cerrarSesionForzada(mensaje) {
    localStorage.removeItem('dg_sesion');
    _lastEstado = null;
    mostrarToastEstado(mensaje, '⚠️');
    renderContent();
    renderSidebar();
    updateProgress();
    renderBotonComprar();
}

function mostrarToastEstado(mensaje, icono = '🎉') {
    const toast = document.getElementById('statusToast');
    if (!toast) return;
    document.getElementById('statusToastIcon').textContent = icono;
    document.getElementById('statusToastText').textContent = mensaje;
    toast.classList.add('visible');
    setTimeout(() => toast.classList.remove('visible'), 5000);
}

let _revalidando = false;

async function revalidarSesion() {
    if (_revalidando) return; // evita llamadas solapadas
    _revalidando = true;
    try {
        const raw = localStorage.getItem('dg_sesion');
        if (!raw) return;

        const sesion = JSON.parse(raw);
        if (!sesion.email) return; // sesión antigua sin email guardado

        // Sesión guardada antes del sistema de código de seguridad:
        // ya no es válida por definición, se cierra directo.
        if (!sesion.codigo) {
            cerrarSesionForzada('Tu sesión ya no es válida. Inicia sesión de nuevo.');
            return;
        }

        const url = WEBHOOK_URL
            + '?action=checkEstado'
            + '&email='  + encodeURIComponent(sesion.email)
            + '&codigo=' + encodeURIComponent(sesion.codigo);

        const res  = await fetch(url);
        const data = await res.json();

        if (!data.ok) {
            // El correo ya no existe en el Sheet
            cerrarSesionForzada('Tu acceso ya no está disponible.');
            return;
        }

        const estado = (data.estado || '').toString().trim().toLowerCase();

        if (!data.sesionValida || estado === 'removido') {
            // El código ya no coincide (alguien más inició sesión con
            // este correo desde entonces) o el acceso fue removido.
            cerrarSesionForzada(
                !data.sesionValida
                    ? 'Tu sesión se abrió en otro dispositivo. Inicia sesión de nuevo.'
                    : 'Tu acceso fue removido.'
            );
            return;
        }

        // Sesión sigue siendo la activa: solo actualizamos el estado
        // si cambió (ej. "prueba" -> "completo" tras una compra).
        const estadoAnterior = sesion.estado;

        if (estado && estado !== estadoAnterior) {
            const nuevaSesion = {
                ...sesion,
                estado: estado,
                expira: Date.now() + SESSION_DAYS * 24 * 60 * 60 * 1000
            };
            localStorage.setItem('dg_sesion', JSON.stringify(nuevaSesion));
            _lastEstado = estado;

            renderContent();
            renderSidebar();
            updateProgress();
            renderBotonComprar();

            if (estado === 'completo') {
                mostrarToastEstado('¡Tu compra fue confirmada! Ya tienes acceso completo 🎓', '🎉');
            }
        }
    } catch (err) {
        console.error('No se pudo revalidar sesión:', err);
    } finally {
        _revalidando = false;
    }
}

// Revalidar al cargar la página
revalidarSesion();

// Revalidar cada 5 minutos mientras el curso está abierto
setInterval(revalidarSesion, 5 * 60 * 1000);

// ============================================================
// BLOQUE 28 — AUTO-COMPLETE DE PDFs
// ============================================================
let autoCompleteTimer = null;

function startAutoComplete(idx) {
    clearTimeout(autoCompleteTimer);
    if (completed.has(idx)) return;
    if (lessons[idx].type === 'pdf') {
        autoCompleteTimer = setTimeout(() => {
            if (currentIdx === idx && !completed.has(idx)) {
                completed.add(idx);
                saveState();
                renderSidebar();
                updateProgress();
            }
        }, 3000);
    }
}

// ============================================================
// BLOQUE 29 — NAVEGACIÓN
// ============================================================
function navigate(idx) {
    clearTimeout(autoCompleteTimer);
    currentIdx = idx;
    pushURL(idx);
    saveState();
    renderSidebar();
    renderContent();
    updateMobileNav();
    document.querySelector('.content-scroll').scrollTo(0, 0);
    startAutoComplete(idx);
}

function toggleDone(idx) {
    completed.has(idx) ? completed.delete(idx) : completed.add(idx);
    saveState();
    renderSidebar();
    updateProgress();
}

// ============================================================
// BLOQUE 30 — SIDEBAR MÓVIL
// ============================================================
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
const menuBtn = document.getElementById('menuToggle');

function closeSidebar() {
    sidebar.classList.remove('open');
    overlay.classList.remove('active');
}

menuBtn.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('active');
});

overlay.addEventListener('click', closeSidebar);

// ============================================================
// BLOQUE 31 — BOTONES PREV/NEXT DESKTOP
// ============================================================
document.getElementById('btnPrev').addEventListener('click', () => {
    if (currentIdx > 0) navigate(currentIdx - 1);
});

document.getElementById('btnNext').addEventListener('click', () => {
    completed.add(currentIdx);
    saveState();
    if (currentIdx < lessons.length - 1) {
        navigate(currentIdx + 1);
    } else {
        updateProgress();
        renderSidebar();
    }
});

window.addEventListener('popstate', e => {
    if (e.state?.idx !== undefined) {
        currentIdx = e.state.idx;
        renderSidebar();
        renderContent();
    }
});

// ============================================================
// BLOQUE 32 — POPSTATE + TEMA
// ============================================================
function toggleTheme() {
    const isLight = document.body.classList.toggle('light');
    localStorage.setItem('sw_theme', isLight ? 'light' : 'dark');
    document.getElementById('btnTheme').textContent = isLight ? '🌙 Modo oscuro' : '☀️ Modo claro';
    document.getElementById('brandAccent').style.color = isLight ? '#1a4d8c' : 'orange';
}

(function() {
    if (localStorage.getItem('sw_theme') === 'light') {
        document.body.classList.add('light');
        document.getElementById('btnTheme').textContent = '🌙 Modo oscuro';
        document.getElementById('brandAccent').style.color = '#1a4d8c';
    }
})();

// ============================================================
// BLOQUE 33 — INIT GENERAL
// ============================================================
loadState();
const urlIdx = getLessonFromURL();
if (urlIdx !== null) currentIdx = urlIdx;
pushURL(currentIdx);
renderSidebar();
renderContent();
updateProgress();
startAutoComplete(currentIdx);

// ============================================================
// BLOQUE 34 — BARRA DE NAVEGACIÓN MÓVIL
// ============================================================
function updateMobileNav() {
    const prev = document.getElementById('btnFloatPrev');
    if (prev) prev.disabled = currentIdx === 0;
}
updateMobileNav();

document.getElementById('btnFloatPrev').addEventListener('click', () => {
    if (currentIdx > 0) navigate(currentIdx - 1);
});

document.getElementById('btnFloatNext').addEventListener('click', () => {
    completed.add(currentIdx);
    saveState();
    if (currentIdx < lessons.length - 1) {
        navigate(currentIdx + 1);
    } else {
        updateProgress();
        renderSidebar();
    }
});

// ============================================================
// BLOQUE 35 — TOOLTIP DE DESCUBRIMIENTO DEL MENÚ
// ============================================================
(function() {
    if (localStorage.getItem('sw_hint_seen')) return;
    if (window.innerWidth > 1080) return;

    const hint = document.getElementById('menuHint');
    if (!hint) return;

    function closeHint() {
        hint.classList.remove('visible');
        localStorage.setItem('sw_hint_seen', '1');
    }

    setTimeout(() => hint.classList.add('visible'), 1200);
    document.getElementById('menuHintClose').addEventListener('click', closeHint);
    document.getElementById('menuToggle').addEventListener('click', closeHint);
})();

// ============================================================
// BLOQUE 36 — FIX: CONTROLES ATASCADOS EN GOOGLE DRIVE
// ============================================================
// Aumentado a 8s para reducir el riesgo de race condition con taps del usuario.
// El reproductor de Drive oculta sus controles tras ~3s de inactividad,
// así que con 8s de intervalo el overlap es mínimo.
(function() {
    setInterval(() => {
        const iframe = document.querySelector('.video-wrap iframe');
        if (!iframe) return;
        iframe.style.pointerEvents = 'none';
        requestAnimationFrame(() => requestAnimationFrame(() => {
            iframe.style.pointerEvents = '';
        }));
    }, 8000);
})();
